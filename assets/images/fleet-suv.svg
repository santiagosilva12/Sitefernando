<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="suvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#14243B"/>
      <stop offset="100%" stop-color="#0A101D"/>
    </linearGradient>
    <linearGradient id="suvBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="25%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="75%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="suvGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A896" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="suvGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="20" fill="url(#suvBg)"/>
  
  <ellipse cx="400" cy="370" rx="340" ry="34" fill="#000000" opacity="0.65"/>
  <ellipse cx="400" cy="370" rx="270" ry="12" fill="#00A896" opacity="0.18"/>

  <!-- SUV Silhouette -->
  <g id="suv-vehicle">
    <!-- Tall Muscular Roof and Body -->
    <path d="M 125 330 C 125 295, 145 270, 190 265 L 250 260 L 320 180 C 350 145, 450 145, 610 150 C 650 152, 675 190, 700 235 L 725 275 C 740 300, 735 335, 720 345 L 135 345 Z" fill="url(#suvBody)" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.4"/>
    
    <!-- Roof Rails -->
    <rect x="330" y="140" width="280" height="6" rx="3" fill="#94A3B8"/>

    <!-- Large Windows -->
    <path d="M 335 185 C 360 155, 450 155, 595 158 C 630 160, 650 195, 670 235 L 305 235 C 315 210, 325 195, 335 185 Z" fill="url(#suvGlass)" stroke="#00E5D0" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="450" y1="156" x2="450" y2="235" stroke="#111827" stroke-width="7"/>
    <line x1="560" y1="157" x2="560" y2="235" stroke="#111827" stroke-width="6"/>

    <!-- LED Headlight / Tail light -->
    <path d="M 715 275 L 735 285 L 720 295 Z" fill="#00E5D0"/>
    <polygon points="735,285 800,265 800,320 735,295" fill="url(#suvGlow)"/>
    <path d="M 135 275 L 125 285 L 130 295 Z" fill="#EF4444"/>

    <!-- Body Contour and Wheel Arches -->
    <path d="M 140 280 C 320 270, 520 270, 715 285" stroke="#00A896" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    
    <!-- High Clearance Cladding -->
    <rect x="300" y="332" width="230" height="12" rx="3" fill="#1F2937" stroke="#374151" stroke-width="1"/>

    <!-- Front Big SUV Wheel -->
    <g transform="translate(615, 335)">
      <circle r="52" fill="#030712" stroke="#4B5563" stroke-width="5"/>
      <circle r="38" fill="#1F2937" stroke="#00A896" stroke-width="2.5"/>
      <circle r="18" fill="#9CA3AF"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="#F3F4F6" stroke-width="3.5"/>
      <line x1="0" y1="-34" x2="0" y2="34" stroke="#F3F4F6" stroke-width="3.5"/>
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="#F3F4F6" stroke-width="3.5"/>
      <line x1="-24" y1="24" x2="24" y2="-24" stroke="#F3F4F6" stroke-width="3.5"/>
    </g>

    <!-- Rear Big SUV Wheel -->
    <g transform="translate(225, 335)">
      <circle r="52" fill="#030712" stroke="#4B5563" stroke-width="5"/>
      <circle r="38" fill="#1F2937" stroke="#00A896" stroke-width="2.5"/>
      <circle r="18" fill="#9CA3AF"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="#F3F4F6" stroke-width="3.5"/>
      <line x1="0" y1="-34" x2="0" y2="34" stroke="#F3F4F6" stroke-width="3.5"/>
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="#F3F4F6" stroke-width="3.5"/>
      <line x1="-24" y1="24" x2="24" y2="-24" stroke="#F3F4F6" stroke-width="3.5"/>
    </g>
  </g>

  <!-- Badge Top -->
  <rect x="30" y="30" width="160" height="38" rx="8" fill="#00A896" fill-opacity="0.15" stroke="#00A896" stroke-width="1.5"/>
  <text x="110" y="54" fill="#00E5D0" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">SUV PREMIUM</text>

  <g transform="translate(620, 35)">
    <rect width="150" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="75" y="24" fill="#CBD5E1" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Até 6 Passageiros</text>
  </g>
</svg>