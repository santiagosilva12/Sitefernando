<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="heroGlow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#00A896" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#0B1E36" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050C16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="roadLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5D0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00A896" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="silverSpeed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Deep Luxury Base -->
  <rect width="1920" height="1080" fill="#060E1A"/>
  <rect width="1920" height="1080" fill="url(#heroGlow)"/>

  <!-- Subtle Perspective Highway Speed Curves (Echoing the Logo) -->
  <path d="M -100 1150 C 400 950, 950 820, 2100 680" stroke="url(#roadLineGrad)" stroke-width="4" fill="none"/>
  <path d="M -100 1180 C 450 980, 1000 850, 2100 710" stroke="#00A896" stroke-width="2" stroke-opacity="0.4" fill="none"/>
  <path d="M 0 1050 C 600 920, 1200 780, 2000 620" stroke="url(#silverSpeed)" stroke-width="8" fill="none"/>

  <!-- Top Geometric Ambient Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.25">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="1080"/>
    <line x1="600" y1="0" x2="600" y2="1080"/>
    <line x1="900" y1="0" x2="900" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1500" y1="0" x2="1500" y2="1080"/>
  </g>

  <!-- Luminous Light Orbs -->
  <circle cx="1500" cy="350" r="280" fill="#00A896" opacity="0.12" filter="blur(60px)"/>
  <circle cx="300" cy="800" r="220" fill="#007B75" opacity="0.08" filter="blur(50px)"/>
</svg>